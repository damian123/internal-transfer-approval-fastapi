services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://approval:approval@postgres:5432/approval
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: approval
      POSTGRES_USER: approval
      POSTGRES_PASSWORD: approval
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approval -d approval"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - approval-data:/var/lib/postgresql/data

volumes:
  approval-data:
